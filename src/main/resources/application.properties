spring.application.name=demo

# Configurações sensíveis (senha do banco, chave do JWT...) ficam FORA do repositório:
# em variáveis de ambiente ou no arquivo application-local.properties (ignorado pelo git).
# Copie application-local.properties.example para application-local.properties e preencha.
spring.config.import=optional:classpath:application-local.properties

# PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/teste}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Upload de imagens de produtos
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=50MB

# Swagger / OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# Chave de assinatura dos tokens JWT (mínimo 32 caracteres). Sem ela, uma chave aleatória é gerada a cada start
app.jwt.secret=${JWT_SECRET:}

# Usuario ADMIN criado automaticamente na inicializacao (troque em producao)
app.admin.email=${ADMIN_EMAIL:admin@ecommerce.com}
app.admin.senha=${ADMIN_SENHA:admin123}

# Dados de demonstração (lojas, clientes, produtos com fotos/variações, pedidos e avaliações).
# Criados uma única vez na inicialização. Para desligar: MOCK_DATA=false
app.mock.enabled=${MOCK_DATA:true}
